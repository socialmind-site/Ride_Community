name: Deploy RIDE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v37-stable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = html.split('<script').slice(1).map(part => { const start = part.indexOf('>'); const end = part.indexOf('</script>'); return start >= 0 && end >= 0 ? part.slice(start + 1, end) : ''; }).filter(source => source.trim());
          if (!scripts.length) throw new Error('No script tags found in index.html');
          let checked = 0;
          for (const [index, source] of scripts.entries()) {
            new vm.Script(source, { filename: 'index.html:inline-script-' + (index + 1) });
            checked++;
          }
          console.log('Validated ' + checked + ' inline script(s).');
          NODE
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
