function setBikeStatus(status){const hidden=$('#signup-bike-status');if(hidden)hidden.value=status;$$('[data-bike-status]').forEach(b=>b.classList.toggle('active',b.dataset.bikeStatus===status));const fields=$('#signup-bike-fields');if(fields)fields.hidden=status==='passenger';const heading=$('#signup-bike-heading');if(heading)heading.textContent=status==='buy'?'La moto che vorresti':'La tua moto';const make=$('#signup-bike-make'),model=$('#signup-bike-model');if(make)make.required=status==='owned';if(model)model.required=status==='owned';}

async function loadMotorcycleModels(makeId){if(motorcycleModelsByMake.has(makeId))return motorcycleModelsByMake.get(makeId);if(!motorcycleModelsPromise){motorcycleModelsPromise=(async()=>{try{const response=await fetch(VEHICLESDB_BASE+'/models.json',{mode:'cors',cache:'force-cache'});if(!response.ok)throw new Error('Catalogo modelli non disponibile');const rows=await response.json();if(!Array.isArray(rows))throw new Error('Formato modelli non valido');return rows;}catch(e){return null}})()}const rows=await motorcycleModelsPromise;if(!rows)return[];const models=rows.filter(m=>m&&m.kind==='motorcycle'&&m.make_id===makeId&&m.name).map(m=>m.name).filter((name,i,all)=>all.indexOf(name)===i).sort((a,b)=>a.localeCompare(b,'it'));motorcycleModelsByMake.set(makeId,models);return models}
function fillBikeModelOptions(){const select=$('#signup-bike-model');if(!select)return;const query=($('#signup-model-search')?.value||'').trim().toLocaleLowerCase('it');const rows=currentBikeModels.filter(name=>!query||name.toLocaleLowerCase('it').includes(query));select.innerHTML='<option value="">Seleziona un modello</option>'+rows.map(name=>'<option value="'+esc(name)+'">'+esc(name)+'</option>').join('')+'<option value="__manual__">Non trovo il modello — inseriscilo</option>';select.disabled=false;const manual=$('#signup-manual-model-field');if(manual)manual.hidden=true}
async function handleBikeMakeChange(makeId){const select=$('#signup-bike-model'),search=$('#signup-model-search'),manualBrand=$('#signup-manual-bike'),manualModel=$('#signup-manual-model-field'),note=$('#signup-catalog-note');currentBikeModels=[];if(search){search.value='';search.disabled=true}if(select){select.disabled=true;select.innerHTML='<option value="">Caricamento modelli…</option>'}if(manualModel)manualModel.hidden=true;if(makeId==='__manual__'){if(manualBrand)manualBrand.hidden=false;if(select)select.hidden=true;if(search)search.hidden=true;return}if(manualBrand)manualBrand.hidden=true;if(select)select.hidden=false;if(search)search.hidden=false;if(!makeId){if(select)select.innerHTML='<option value="">Seleziona prima la marca</option>';return}if(note)note.textContent='Sto caricando i modelli disponibili per questa marca…';currentBikeModels=await loadMotorcycleModels(makeId);if(!select)return;if(search)search.disabled=false;if(!currentBikeModels.length){if(note)note.textContent='Non riesco a caricare i modelli per questa marca. Puoi inserirli manualmente.';select.innerHTML='<option value="__manual__">Inserisci modello manualmente</option>';select.disabled=false;if(manualModel)manualModel.hidden=false;return}fillBikeModelOptions();if(note)note.textContent=currentBikeModels.length+' modelli disponibili. Catalogo VehiclesDB · release '+VEHICLESDB_VERSION+'.'}
function syncManualModel(){const make=$('#signup-bike-make'),model=$('#signup-bike-model'),manualBrand=$('#signup-manual-bike'),manualModel=$('#signup-manual-model-field');if(manualBrand)manualBrand.hidden=make?.value!=='__manual__';if(manualModel)manualModel.hidden=model?.value!=='__manual__';const status=$('#signup-bike-status')?.value||'';if($('#signup-manual-make'))$('#signup-manual-make').required=status==='owned'&&make?.value==='__manual__';if($('#signup-manual-model'))$('#signup-manual-model').required=status==='owned'&&make?.value==='__manual__';if($('#signup-manual-model-only'))$('#signup-manual-model-only').required=status==='owned'&&model?.value==='__manual__'}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function routeById(id){return routes.find(r=>r.id===id)||routes[0]}

function routeRow(r){return `<article class="route-row ${state.selectedRoute===r.id?'selected':''}" data-route-select="${r.id}"><img src="${photo(r)}" alt="${esc(r.name)}" loading="lazy"><div class="route-copy"><strong>${esc(r.name)}</strong><small>${r.distance} km · ${esc(r.duration)} · ${esc(r.level)}</small><div class="rating">★ ${r.rating} <span style="color:#7f8e90;font-weight:600">(${r.reviews})</span></div></div><button class="heart ${state.favorites.includes(r.id)?'saved':''}" data-favorite="${r.id}" aria-label="Salva itinerario">${ico('heart',16)}</button></article>`}
function feedColumn(){const r=selectedRoute();return `<section class="feed-column"><div class="feed-top"><div class="hello">Pronto per una nuova avventura?<strong>La strada ti aspetta.</strong></div><button class="icon-btn" data-view="notifications" aria-label="Notifiche">${ico('bell')}</button></div><div class="hero-card"><img src="./assets/dolomites-road.webp" alt="Motociclista su una strada alpina"><div class="hero-content"><div class="hero-kicker">RIDE · MOTORCYCLE COMMUNITY</div><h1>Trova compagni,<br>vivi la strada <span style="color:var(--lime)">insieme.</span></h1><p>Organizza uscite, scopri nuovi itinerari e condividi la tua passione.</p><button class="hero-cta" data-view="map">${ico('compass',14)} Esplora la mappa ${ico('arrow',14)}</button></div><div class="hero-tag"><small>ROAD TRIP IN EVIDENZA</small><strong>${esc(r.name)}</strong></div></div><div class="quick-grid"><button class="quick-action" data-action="find-riders"><span class="quick-icon">${ico('group',25)}</span><span>Trova<br>compagni</span></button><button class="quick-action" data-action="create-ride"><span class="quick-icon">${ico('calendar',25)}</span><span>Crea<br>uscita</span></button><button class="quick-action" data-view="routes"><span class="quick-icon">${ico('route',25)}</span><span>Esplora<br>itinerari</span></button><button class="quick-action" data-action="find-passenger"><span class="quick-icon">${ico('motorcycle',25)}</span><span>Cerca<br>zavorrina/o</span></button></div><section class="feed-section"><div class="section-heading"><h2>${ico('mountain')} Road Trip consigliati</h2><button data-view="routes">Vedi tutti ›</button></div><div class="route-list">${[routes[1],routes[0],routes[3]].map(routeRow).join('')}</div></section><section class="feed-section"><div class="section-heading"><h2>${ico('group')} Uscite in programma</h2><button data-view="events">Vedi tutte ›</button></div><div class="ride-preview"><img src="./assets/garda-road.webp" alt="Giro in moto sul Lago di Garda"><div><strong>Giro del Lago di Garda · Domenica</strong><small>${ico('pin',11)} Riva del Garda · 8 partecipanti</small><div class="ride-bottom"><span class="seat-pill">2 posti liberi</span><button class="join-mini" data-action="join-garda">Partecipa</button></div></div></div></section></section>`}
function mapColumn(){return `<section class="map-column"><div class="map-toolbar"><label class="searchbox">${ico('search')}<input id="map-search" type="search" list="map-suggestions" placeholder="Cerca un luogo, un itinerario o un utente…" value="${esc(state.search)}"><datalist id="map-suggestions">${zones.map(z=>`<option value="${esc(z.name)}"></option>`).join('')}${routes.map(r=>`<option value="${esc(r.name)}"></option>`).join('')}</datalist></label><button class="toolbar-btn" data-action="map-filter" aria-label="Filtri">${ico('filter')}</button><button class="toolbar-btn" data-action="locate" aria-label="La mia posizione">${ico('locate')}</button></div><div class="map-filterbar">${[['Tutti','group'],['Motociclisti','motorcycle'],['Passeggeri','user'],['Uscite','calendar'],['Itinerari','route']].map(([t,i])=>`<button class="filter-chip ${state.mapFilter===t?'active':''}" data-map-filter="${t}">${ico(i,13)}${t}</button>`).join('')}</div><div class="map-wrap"><div id="main-map" role="region" aria-label="Mappa interattiva reale del Lago di Garda"></div><div class="map-top-overlay"><div class="map-context"><small>AREA ESPLORATA</small><strong>Lago di Garda · ${state.radius} km</strong></div></div><div class="map-layer-switch">${[['road','Mappa'],['satellite','Satellite'],['terrain','Rilievo']].map(([id,label])=>`<button data-layer="${id}" class="${state.mapLayer===id?'active':''}">${label}</button>`).join('')}</div><div class="map-control-stack"><button data-map-action="zoom-in" aria-label="Zoom avanti">${ico('plus')}</button><button data-map-action="zoom-out" aria-label="Zoom indietro">${ico('zoomout')}</button><button data-map-action="reset" aria-label="Centra area">${ico('locate')}</button></div><div class="map-status" id="map-status">Connessione cartografica in corso…</div><div class="map-bottom-hint"><b>Trascina</b> per esplorare · usa i controlli per lo zoom</div><div class="map-attribution" id="map-attribution">Imagery © Esri, Maxar, Earthstar Geographics</div><div class="map-fallback" id="map-fallback" hidden></div><div class="route-player"><button class="play-btn" id="route-play" data-action="play-route" aria-label="Riproduci road trip">${ico('play',15)}</button><div class="player-main"><div class="player-title"><strong>Animazione Road Trip</strong><span id="route-status">Calcolo del percorso stradale…</span></div><input type="range" id="route-slider" min="0" max="100" value="0" aria-label="Avanzamento del road trip"></div><span class="player-time" id="route-time">00:00</span></div></div><div class="nearby-block"><div class="nearby-head"><strong>${ico('group')} Motociclisti vicino a te <span style="color:var(--lime);font-size:8px">· PROFILI DEMO</span></strong><span>Raggio ${state.radius} km</span></div><div class="people-row">${demoPeople.map(p=>`<div class="person-card"><span class="avatar ${p.tone}">${p.initials}</span><strong>${p.name}</strong><small>${p.km} · demo</small><span class="role-pill ${p.role==='Passeggera'?'passenger':''}">${p.role==='Passeggera'?'Passeggera':'Rider'}</span></div>`).join('')}</div></div></section>`}
function elevationChart(r){const vals=r.stops.map(s=>s[3]||100);const min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1,max-min);const coords=vals.map((v,i)=>[20+i*(260/Math.max(1,vals.length-1)),66-((v-min)/range)*50]);const points=coords.map(p=>`${p[0]},${p[1]}`).join(' ');const area=`M ${coords[0][0]},70 L ${coords.map(p=>`${p[0]},${p[1]}`).join(' L ')} L ${coords[coords.length-1][0]},70 Z`;return `<svg class="elevation-svg" viewBox="0 0 300 82" role="img" aria-label="Profilo altimetrico indicativo"><defs><linearGradient id="elevFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b8f52e" stop-opacity=".32"/><stop offset="1" stop-color="#b8f52e" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#elevFill)"/><polyline points="${points}" fill="none" stroke="#b8f52e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 70H280" stroke="#344449" stroke-width="1" stroke-dasharray="3 4"/></svg>`}
function detailColumn(){const r=selectedRoute();const highest=Math.max(...r.stops.map(s=>s[3]||0));return `<aside class="detail-column"><div class="detail-head"><strong>Road Trip selezionato</strong><div class="detail-actions"><button data-action="share-route" aria-label="Condividi">${ico('share')}</button><button data-favorite="${r.id}" aria-label="Salva itinerario">${ico('heart')}</button></div></div><div class="route-hero"><img src="${photo(r)}" alt="${esc(r.name)}"><span class="route-hero-tag">ROAD TRIP · ${esc(r.region)}</span></div><div class="route-title-row"><h2>${esc(r.name)}</h2><span class="rating">★ ${r.rating}</span></div><p class="route-area">${esc(r.area)} · ${r.reviews} recensioni demo</p><div class="route-stats"><div class="stat">${ico('route')}<strong>≈ ${r.distance} km</strong><small>Lunghezza stimata</small></div><div class="stat">${ico('clock')}<strong>${esc(r.duration)}</strong><small>Durata indicativa</small></div><div class="stat">${ico('mountain')}<strong>${highest.toLocaleString('it-IT')} m</strong><small>Quota max</small></div><div class="stat">${ico('compass')}<strong>${esc(r.level)}</strong><small>Difficoltà</small></div></div><div class="detail-tabs">${['Percorso','Tappe','Info'].map(t=>`<button data-detail-tab="${t}" class="${state.detailTab===t?'active':''}">${t}</button>`).join('')}</div>${state.detailTab==='Percorso'?`<div class="elevation-card"><div class="elevation-head"><strong>Profilo altimetrico</strong><span>Anteprima indicativa</span></div>${elevationChart(r)}</div><div class="stop-list">${r.stops.slice(0,5).map((s,i)=>`<div class="stop-item"><span class="stop-dot"></span><div><strong>${esc(s[0])}</strong><small>${i===0?'Partenza':i===r.stops.length-1?'Arrivo':'Tappa'} · quota ${s[3]||'—'} m</small></div><span class="stop-distance">${i===0?'START':`TAPPA ${i+1}`}</span></div>`).join('')}</div>`:state.detailTab==='Tappe'?`<div class="stop-list">${r.stops.map((s,i)=>`<div class="stop-item"><span class="stop-dot"></span><div><strong>${esc(s[0])}</strong><small>${i===0?'Partenza':i===r.stops.length-1?'Arrivo':'Sosta consigliata'} · ${s[3]||'—'} m s.l.m.</small></div><span class="stop-distance">${i+1}/${r.stops.length}</span></div>`).join('')}</div>`:`<div class="detail-note">${esc(r.notes)}<br><br>La geometria viene calcolata sulle strade OpenStreetMap tramite il servizio OSRM quando disponibile. La durata è una stima automobilistica, non una previsione motociclistica né navigazione turn-by-turn.</div>`}<div class="detail-note">${ico('info',13)} Le distanze e i tempi mostrati sono indicativi finché non viene calcolato il percorso reale.</div><button class="detail-cta" data-action="join-route">${ico('group')} Partecipa a questo Road Trip</button><div class="detail-secondary"><button data-action="play-route">${ico('play')} Segui animazione</button><a href="${googleDirectionsUrl(r)}" target="_blank" rel="noopener noreferrer">${ico('map')} Apri navigatore</a></div></aside>`}
function googleDirectionsUrl(r){const s=r.stops;const origin=`${s[0][1]},${s[0][2]}`,dest=`${s[s.length-1][1]},${s[s.length-1][2]}`,way=s.slice(1,-1).map(p=>`${p[1]},${p[2]}`).join('|');return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}${way?'&waypoints='+encodeURIComponent(way):''}&travelmode=driving`}

 this.people.forEach(p=>{const q=this.toScreen(p.lat,p.lon);if(q.x<-30||q.x>w+30||q.y<-30||q.y>h+30)return;out+=`<g class="map-rider-marker" data-person-id="${p.id}" transform="translate(${q.x},${q.y})"><circle r="18" fill="#14201c" stroke="${p.role==='Passeggera'?'#e58bd1':'#b8f52e'}" stroke-width="2.5"/><text y="4" text-anchor="middle" fill="#fff" font-size="9" font-weight="900">${esc(p.initials)}</text><circle cx="13" cy="-13" r="4" fill="#b8f52e" stroke="#071116" stroke-width="2"/></g>`});
 if(this.showEvent){const q=this.toScreen(45.7629,10.8106);out+=`<g transform="translate(${q.x},${q.y})"><circle r="15" fill="#b8f52e" stroke="#071116" stroke-width="3"/><text y="4" text-anchor="middle" fill="#10190c" font-size="10" font-weight="900">8</text></g>`}
 this.overlay.innerHTML=`<defs><filter id="routeGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${out}`}
 remove(){clearTimeout(this.watchdog);this.resizeObserver?.disconnect();this.viewport?.replaceChildren();this.cache.clear();if(this.wrap)this.wrap.classList.remove('fallback-active')}
 fallback(){if(this.fallbackShown)return;this.fallbackShown=true;mapFallback()}
}
function mapFallback(){const box=$('#map-fallback');if(!box)return;const c=mapObject?mapObject.getCenter():{lat:state.center.lat,lng:state.center.lon};const z=mapObject?mapObject.getZoom():9;const link=`https://www.google.com/maps/@${c.lat},${c.lng},${z}z`;box.hidden=false;box.innerHTML=`<iframe title="Mappa Google Maps interattiva di riserva" loading="eager" referrerpolicy="strict-origin-when-cross-origin" src="https://maps.google.com/maps?q=${c.lat},${c.lng}&z=${z}&output=embed"></iframe><div class="map-fallback-card"><button class="map-fallback-close" data-action="dismiss-map-fallback" aria-label="Chiudi avviso">×</button><strong>Cartografia alternativa</strong><p>Il provider cartografico non risponde. Puoi continuare a esplorare con Google Maps.</p><a href="${link}" target="_blank" rel="noopener">Apri Google Maps</a></div>`;$('.map-wrap')?.classList.add('fallback-active');setMapStatus('',false)}
function setMapStatus(text,visible=true){const el=$('#map-status');if(!el)return;el.textContent=text;el.classList.toggle('visible',visible)}
function switchLayer(id){if(!mapObject)return;state.mapLayer=id;$$('[data-layer]').forEach(b=>b.classList.toggle('active',b.dataset.layer===id));const attr=$('#map-attribution');if(attr)attr.textContent=id==='satellite'?'Imagery © Esri, Maxar, Earthstar Geographics':id==='terrain'?'Terrain © Esri':'© OpenStreetMap contributors';mapObject.setLayer(id);save()}
function addRiders(){if(!mapObject)return;const people=demoPeople.filter(p=>state.mapFilter==='Tutti'||(state.mapFilter==='Motociclisti'&&p.role==='Motociclista')||(state.mapFilter==='Passeggeri'&&p.role==='Passeggera'));mapObject.setPeople(['Tutti','Motociclisti','Passeggeri'].includes(state.mapFilter)?people:[])}
function addEventMarker(){if(mapObject)mapObject.setEvent(state.mapFilter==='Uscite')}
function clearRouteLayers(){routeGeometry=[];routeReal=false;if(mapObject)mapObject.setRoute([],[])}
async function getRoadGeometry(r){if(routeCache.has(r.id))return routeCache.get(r.id);const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),16000);try{const url=`https://router.project-osrm.org/route/v1/driving/${routeStopsForOSRM(r)}?overview=full&geometries=geojson&steps=false&alternatives=false`;const response=await fetch(url,{signal:controller.signal,mode:'cors'});if(!response.ok)throw new Error(`Routing HTTP ${response.status}`);const data=await response.json();if(data.code!=='Ok'||!data.routes?.[0]?.geometry?.coordinates?.length)throw new Error('Percorso non disponibile');const result={latlngs:data.routes[0].geometry.coordinates.map(([lon,lat])=>[lat,lon]),distance:Math.round(data.routes[0].distance/1000),duration:Math.round(data.routes[0].duration/60)};routeCache.set(r.id,result);return result}catch(e){return null}finally{clearTimeout(timeout)}}
function routeLine(r,geometry){clearRouteLayers();routeGeometry=geometry?.latlngs||[];routeReal=!!geometry;if(mapObject){mapObject.setRoute(routeGeometry,r.stops);if(routeReal)mapObject.fitRoute(routeGeometry)}const status=$('#route-status'),slider=$('#route-slider'),play=$('#route-play');if(status)status.textContent=geometry?`Tracciato stradale calcolato · ${geometry.distance} km`:'Tracciato stradale non disponibile · apri il navigatore';if(slider){slider.value='0';slider.disabled=!routeReal}if(play)play.disabled=!routeReal;$$('[data-action="play-route"]').forEach(b=>b.disabled=!routeReal);updateRouteProgress(0)}
async function selectRouteOnMap(){if(!mapObject)return;const targetMap=mapObject,r=selectedRoute();setMapStatus('Calcolo del percorso sulle strade…');const geometry=await getRoadGeometry(r);if(mapObject!==targetMap)return;routeLine(r,geometry);setMapStatus('',false);if(geometry){const stats=$$('.route-stats .stat strong');if(stats[0])stats[0].textContent=`${geometry.distance} km`;if(stats[1])stats[1].textContent=`~ ${Math.floor(geometry.duration/60)} h ${String(geometry.duration%60).padStart(2,'0')} min`;const status=$('#route-status');if(status)status.textContent=`Strada calcolata · ${geometry.distance} km`}else{setMapStatus('Percorso stradale non disponibile: la mappa resta esplorabile.',true)}}
function initMap(){const el=$('#main-map');if(!el)return;setMapStatus('Caricamento cartografia reale…');try{mapObject=new RideTileMap(el);window.rideMap=mapObject;switchLayer(state.mapLayer||'satellite');addRiders();addEventMarker();if(state.mapFilter==='Itinerari'||state.view==='home'||state.view==='map')selectRouteOnMap();else mapObject.setView([state.center.lat,state.center.lon],10);}catch(e){mapFallback()}}
function updateRouteProgress(progress){if(!mapObject||!routeGeometry.length||!routeReal)return;const p=Math.max(0,Math.min(1,progress));mapObject.setProgress(p);const slider=$('#route-slider');if(slider&&document.activeElement!==slider)slider.value=String(Math.round(p*100));const time=$('#route-time');if(time){const seconds=Math.round(p*18*60);time.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}}
function stopAnimation(){animationPlaying=false;if(animationId)cancelAnimationFrame(animationId);animationId=0;const b=$('#route-play');if(b)b.innerHTML=ico('play',15)}
function playAnimation(){if(!mapObject||!routeGeometry.length||!routeReal){toast('Attendi il calcolo del tracciato stradale.');return}if(animationPlaying){stopAnimation();return}animationPlaying=true;animationFrom=Number($('#route-slider')?.value||0)/100;if(animationFrom>=1)animationFrom=0;animationStart=performance.now();const b=$('#route-play');if(b)b.innerHTML=ico('pause',15);const tick=now=>{if(!animationPlaying)return;const p=Math.min(1,animationFrom+(now-animationStart)/animationDuration);updateRouteProgress(p);if(p>=1){stopAnimation();return}animationId=requestAnimationFrame(tick)};animationId=requestAnimationFrame(tick)}
function setLayer(id){switchLayer(id)}
function resetMap(){if(!mapObject)return;if(routeReal)mapObject.fitRoute(routeGeometry);else mapObject.setView([45.82,10.82],9)}
function searchMap(query){const q=query.trim().toLocaleLowerCase('it');if(!q)return;const r=routes.find(r=>r.name.toLocaleLowerCase('it').includes(q)||r.region.toLocaleLowerCase('it').includes(q));if(r){state.selectedRoute=r.id;state.search=query;render();return}const z=zones.find(z=>z.name.toLocaleLowerCase('it').includes(q));if(z&&mapObject){mapObject.flyTo([z.lat,z.lon],11);state.center={lat:z.lat,lon:z.lon};toast(`Mappa centrata su ${z.name}`);return}const p=demoPeople.find(p=>p.name.toLocaleLowerCase('it').includes(q)||p.city.toLocaleLowerCase('it').includes(q));if(p&&mapObject){mapObject.flyTo([p.lat,p.lon],12);toast(`Profilo demo: ${p.name}`);return}toast('Nessun risultato nella ricerca dimostrativa.')}

function toggleFavorite(id){const i=state.favorites.indexOf(id);if(i>=0){state.favorites.splice(i,1);toast('Itinerario rimosso dai salvati')}else{state.favorites.push(id);toast('Itinerario salvato')}save();render()}
function onAction(action,el){if(action==='create-ride'){rideModal();return}if(action==='create-group'){groupModal();return}if(action==='close-modal'){closeModal();return}if(action==='find-riders'){state.mapFilter='Tutti';setView('map');return}if(action==='find-passenger'){state.mapFilter='Passeggeri';setView('map');return}if(action==='locate'){if(!navigator.geolocation){toast('Geolocalizzazione non disponibile.');return}toast('Richiesta posizione al browser…');navigator.geolocation.getCurrentPosition(p=>{if(mapObject)mapObject.flyTo([p.coords.latitude,p.coords.longitude],12);state.center={lat:p.coords.latitude,lon:p.coords.longitude};toast('Mappa centrata sulla tua posizione. Non viene condivisa.')},()=>toast('Permesso non concesso: puoi scegliere una città dalla ricerca.'),{enableHighAccuracy:false,timeout:12000,maximumAge:600000});return}if(action==='play-route'){playAnimation();return}if(action==='join-route'){if(!state.joined.includes(state.selectedRoute)){state.joined.push(state.selectedRoute);save();toast('Richiesta demo registrata su questo dispositivo.')}else toast('Hai già aderito a questa uscita demo.');return}if(action==='join-garda'||action==='join-event'){toast('Partecipazione demo registrata su questo dispositivo.');return}if(action==='open-route-map'){const id=el.dataset.route;state.selectedRoute=id;state.view='map';render();return}if(action==='share-route'){const url=googleDirectionsUrl(selectedRoute());if(navigator.share){navigator.share({title:selectedRoute().name,url}).catch(()=>{})}else{toast('Puoi condividere il link del navigatore dal pulsante in basso.')}return}if(action==='dismiss-map-fallback'){const box=$('#map-fallback');if(box)box.hidden=true;return}if(action==='map-filter'){showModal('Area di ricerca',`<form id="radius-form"><div class="form-grid"><div class="form-field full"><label for="radius-select">Raggio di ricerca</label><select id="radius-select" name="radius">${[10,25,50,100,200].map(v=>`<option value="${v}" ${state.radius===v?'selected':''}>${v} km</option>`).join('')}</select></div><div class="form-field full"><label>Profili visibili</label><select name="filter"><option ${state.mapFilter==='Tutti'?'selected':''}>Tutti</option><option ${state.mapFilter==='Motociclisti'?'selected':''}>Motociclisti</option><option ${state.mapFilter==='Passeggeri'?'selected':''}>Passeggeri</option></select></div></div><div class="modal-actions"><button type="button" class="secondary-btn" data-action="close-modal">Annulla</button><button type="submit" class="primary-btn">Applica filtri</button></div></form>`);return}}
document.addEventListener('click',e=>{const bikeChoice=e.target.closest('[data-bike-status]');if(bikeChoice){setBikeStatus(bikeChoice.dataset.bikeStatus);return}const v=e.target.closest('[data-view]');if(v){setView(v.dataset.view);return}const fav=e.target.closest('[data-favorite]');if(fav){e.stopPropagation();toggleFavorite(fav.dataset.favorite);return}const route=e.target.closest('[data-route-select]');if(route){const id=route.dataset.routeSelect;state.selectedRoute=routes.some(r=>r.id===id)?id:'garda';if(state.view==='routes')state.view='map';render();return}const filter=e.target.closest('[data-map-filter]');if(filter){state.mapFilter=filter.dataset.mapFilter;$$('[data-map-filter]').forEach(b=>b.classList.toggle('active',b.dataset.mapFilter===state.mapFilter));if(mapObject){addRiders();addEventMarker()}save();return}const layer=e.target.closest('[data-layer]');if(layer){setLayer(layer.dataset.layer);return}const mapAction=e.target.closest('[data-map-action]');if(mapAction){if(mapAction.dataset.mapAction==='zoom-in')mapObject?.zoomIn();if(mapAction.dataset.mapAction==='zoom-out')mapObject?.zoomOut();if(mapAction.dataset.mapAction==='reset')resetMap();return}const tab=e.target.closest('[data-detail-tab]');if(tab){state.detailTab=tab.dataset.detailTab;render();return}const action=e.target.closest('[data-action]');if(action){onAction(action.dataset.action,action);return}const group=e.target.closest('[data-group-join]');if(group){const id=group.dataset.groupJoin;if(!state.joinedGroups.includes(id))state.joinedGroups.push(id);save();render();toast('Ti sei unito al gruppo demo.');return}const chat=e.target.closest('[data-chat-select]');if(chat){state.activeChat=chat.dataset.chatSelect;render();return}if(e.target.id==='modal-backdrop')closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='route-slider'){stopAnimation();const b=$('#route-play');if(b)b.innerHTML=ico('play',15);updateRouteProgress(Number(e.target.value)/100)}if(e.target.id==='map-search'){state.search=e.target.value}if(e.target.id==='signup-model-search')fillBikeModelOptions()});
document.addEventListener('change',e=>{if(e.target.id==='signup-bike-make')handleBikeMakeChange(e.target.value);if(e.target.id==='signup-bike-model')syncManualModel()});
document.addEventListener('keydown',e=>{if(e.target.id==='map-search'&&e.key==='Enter'){e.preventDefault();searchMap(e.target.value)}if(e.key==='Escape')closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='signup-form'){e.preventDefault();const d=new FormData(e.target),firstName=String(d.get('firstName')||'').trim(),lastName=String(d.get('lastName')||'').trim(),email=String(d.get('email')||'').trim(),status=String(d.get('bikeStatus')||'');if(!status){toast('Scegli come vuoi vivere RIDE.');return}let makeName='',modelName='';if(status!=='passenger'){const makeId=String(d.get('bikeMake')||'');const selectedMake=motorcycleMakes.find(m=>m.id===makeId);makeName=makeId==='__manual__'?String(d.get('manualMake')||'').trim():(selectedMake?.name||'');modelName=String(d.get('bikeModel')||'')==='__manual__'?String(d.get('manualModelOnly')||'').trim():String(d.get('bikeModel')||'');if(makeId==='__manual__')modelName=String(d.get('manualModel')||'').trim();if(status==='owned'&&(!makeName||!modelName)){toast('Seleziona la marca e il modello della tua moto, oppure inseriscili manualmente.');return}}const bike=status==='owned'?(makeName+' '+modelName).trim():status==='buy'?(makeName?(makeName+(modelName?' '+modelName:'')):'Sto scegliendo la mia prima moto'):'Cerco un posto da passeggero/a';state.profile={firstName:firstName,lastName:lastName,name:(firstName+' '+lastName).trim(),email:email,bike:bike,bikeMake:makeName,bikeModel:modelName,bikeStatus:status,role:status==='owned'?'Motociclista':status==='buy'?'Futuro motociclista':'Passeggero/a',style:'Turistico',availability:'Weekend'};state.onboarded=true;state.view='home';save();render();toast('Profilo creato su questo dispositivo. La registrazione online sarà collegata al database.');return};if(e.target.id==='new-ride-form'){e.preventDefault();const d=new FormData(e.target);state.myRides.unshift({id:String(Date.now()),title:String(d.get('title')).trim(),date:String(d.get('date')),time:String(d.get('time')),route:String(d.get('route')),seats:Number(d.get('seats')),level:String(d.get('level')),notes:String(d.get('notes'))});save();closeModal();setView('events');toast('Uscita demo creata.');return}if(e.target.id==='new-group-form'){e.preventDefault();const d=new FormData(e.target);state.myGroups=state.myGroups||[];state.myGroups.unshift({id:'new-'+Date.now(),name:String(d.get('name')).trim(),area:String(d.get('area')).trim(),desc:String(d.get('description')).trim(),members:1});save();closeModal();render();toast('Gruppo demo creato.');return}if(e.target.id==='radius-form'){e.preventDefault();const d=new FormData(e.target);state.radius=Number(d.get('radius'))||50;state.mapFilter=String(d.get('filter')||'Tutti');save();closeModal();render();toast(`Raggio impostato a ${state.radius} km`);return}if(e.target.id==='profile-form'){e.preventDefault();const d=new FormData(e.target),firstName=String(d.get('firstName')||'').trim(),lastName=String(d.get('lastName')||'').trim();state.profile={...state.profile,firstName:firstName,lastName:lastName,name:(firstName+' '+lastName).trim(),email:String(d.get('email')||'').trim(),style:String(d.get('style')),availability:String(d.get('availability'))};save();render();toast('Profilo aggiornato su questo dispositivo.');return}if(e.target.id==='chat-form'){e.preventDefault();const input=$('#chat-input'),text=input?.value.trim();if(!text)return;state.chatMessages.push({chat:state.activeChat,text:text.slice(0,400),mine:true});save();render();return}});

document.addEventListener('click',e=>{const b=e.target.closest('[data-action="open-route-map"]');if(b){state.selectedRoute=b.dataset.route;state.view='map';render()}});
render();
