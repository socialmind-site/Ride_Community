.trip-plan-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.trip-plan-metrics span{padding:10px;border:1px solid #2d4033;border-radius:10px;background:#111e15}
.trip-plan-metrics strong{display:block;font-size:13px;color:#eef5eb}
.trip-plan-metrics small{display:block;margin-top:4px;font-size:7px;color:#94a496}
.trip-plan-next{margin-top:10px;color:#a8b7aa;font-size:8px;line-height:1.5}
.trip-plan-card-actions{display:flex;gap:7px;margin-top:13px}
.trip-plan-card-actions button{flex:1;min-height:37px;padding:0 10px;font-size:8px}
.trips-empty{display:grid;justify-items:center;text-align:center;padding:42px 20px;border:1px dashed #405341;border-radius:18px;background:#101b14}
.trips-empty>span{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#263b25;color:var(--lime)}
.trips-empty h2{font-size:19px;margin:14px 0 6px}
.trips-empty p{max-width:500px;color:#9eaea1;font-size:9px;line-height:1.6;margin:0 0 16px}
.trip-detail-summary{display:grid;gap:9px;padding:12px;border:1px solid #304536;border-radius:13px;background:#101c14}
.trip-detail-summary>div:nth-child(2){display:grid;gap:4px}
.trip-detail-summary>div:nth-child(2) strong{font-size:10px}
.trip-detail-summary>div:nth-child(2) small{font-size:8px;color:#9eaea1}
.trip-detail-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.trip-detail-metrics span{padding:8px 6px;border-radius:9px;background:#1a2b1c;color:var(--lime);text-align:center;font-size:8px;font-weight:950}
.trip-detail-notes{color:#a9b8aa;font-size:9px;line-height:1.5}
.trip-detail-days{display:grid;gap:8px;margin-top:12px}
.trip-day-row{display:grid;grid-template-columns:31px minmax(0,1fr);gap:9px;padding:10px;border:1px solid #2e4234;border-radius:12px;background:#0d1811}
.trip-day-index{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#263a25;color:var(--lime);font-size:8px;font-weight:950}
.trip-day-copy{min-width:0}.trip-day-copy strong{display:block;font-size:9px}.trip-day-copy small,.trip-day-copy span{display:block;margin-top:4px;color:#9aa99d;font-size:7px;line-height:1.45}
.trip-day-copy p{margin:6px 0 0;color:#c0cbbf;font-size:8px;line-height:1.5}
.trip-day-actions{grid-column:2;display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}
.trip-day-actions button{min-height:29px;padding:0 9px;border:1px solid #40573a;border-radius:8px;background:#1b2d1c;color:var(--lime);font-size:7px;font-weight:900}
.trip-day-actions .delete-trip-day{border-color:#624040;background:#2b1a1a;color:#e5aaaa}
.trip-modal-actions{justify-content:space-between}
@media(max-width:820px){.trip-plans-grid{grid-template-columns:1fr}.trips-intro-panel{align-items:flex-start}}
@media(max-width:560px){
 .trips-intro-panel{padding:12px}.trips-intro-panel strong{font-size:12px}.trips-intro-panel p{font-size:8px}
 .trip-plan-card{padding:13px}.trip-plan-card h3{font-size:15px}.trip-plan-card-actions{flex-direction:column}
 .trip-detail-metrics span{font-size:7px;padding:7px 4px}
}

async function loadMotorcycleMakes(){const select=$('#signup-bike-make');if(!select)return;if(!motorcycleMakesPromise){motorcycleMakesPromise=(async()=>{try{const response=await fetch(VEHICLESDB_BASE+'/makes.json',{mode:'cors',cache:'force-cache'});if(!response.ok)throw new Error('Catalogo marche non disponibile');const rows=await response.json();if(!Array.isArray(rows))throw new Error('Formato catalogo non valido');motorcycleMakes=rows.filter(m=>m&&m.id&&m.name).sort((a,b)=>a.name.localeCompare(b.name,'it'));}catch(e){motorcycleMakes=fallbackMakes.slice().sort((a,b)=>a.name.localeCompare(b.name,'it'));const note=$('#signup-catalog-note');if(note)note.textContent='Catalogo completo temporaneamente non raggiungibile. Puoi scegliere una marca comune o inserirla manualmente.';}})()}await motorcycleMakesPromise;const current=$('#signup-bike-make');if(!current)return;current.innerHTML='<option value="">Seleziona una marca</option>'+motorcycleMakes.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('')+'<option value="__manual__">Non trovo la marca</option>';current.disabled=false}
async function loadMotorcycleModels(makeId){if(motorcycleModelsByMake.has(makeId))return motorcycleModelsByMake.get(makeId);if(!motorcycleModelsPromise){motorcycleModelsPromise=(async()=>{try{const response=await fetch(VEHICLESDB_BASE+'/models.json',{mode:'cors',cache:'force-cache'});if(!response.ok)throw new Error('Catalogo modelli non disponibile');const rows=await response.json();if(!Array.isArray(rows))throw new Error('Formato modelli non valido');return rows;}catch(e){return null}})()}const rows=await motorcycleModelsPromise;if(!rows)return[];const models=rows.filter(m=>m&&m.kind==='motorcycle'&&m.make_id===makeId&&m.name).map(m=>m.name).filter((name,i,all)=>all.indexOf(name)===i).sort((a,b)=>a.localeCompare(b,'it'));motorcycleModelsByMake.set(makeId,models);return models}

function routeSampleIndexes(length,maxPoints=90){

function routeCurveAnalysis(points){
 if(!Array.isArray(points)||points.length<3)return{turns:0,per100:0,distance:0};
 let total=0,segment=0,lastSample=points[0],bearings=[];
 for(let i=1;i<points.length;i++){
  const d=distanceKm({lat:points[i-1][0],lon:points[i-1][1]},{lat:points[i][0],lon:points[i][1]});
  total+=d;segment+=d;
  if(segment>=.25||i===points.length-1){
   const a=lastSample,b=points[i],rad=Math.PI/180,dlon=(b[1]-a[1])*rad;
   const y=Math.sin(dlon)*Math.cos(b[0]*rad);
   const x=Math.cos(a[0]*rad)*Math.sin(b[0]*rad)-Math.sin(a[0]*rad)*Math.cos(b[0]*rad)*Math.cos(dlon);
   bearings.push((Math.atan2(y,x)*180/Math.PI+360)%360);lastSample=b;segment=0;
  }
 }
 let turns=0,curvature=0;
 for(let i=1;i<bearings.length;i++){
  const diff=Math.abs(((bearings[i]-bearings[i-1]+540)%360)-180);
  if(diff>=22&&diff<=155){turns++;curvature+=diff}
 }
 return{turns:turns,per100:total>0?Math.round(turns/total*100):0,distance:total,curvature:curvature};
}

function formatElapsedRide(ms){
 const seconds=Math.max(0,Math.floor(ms/1000)),hours=Math.floor(seconds/3600),minutes=Math.floor((seconds%3600)/60),secs=seconds%60;
 return hours?hours+' h '+String(minutes).padStart(2,'0')+' min':minutes+' min '+String(secs).padStart(2,'0')+' s';
}
function nearestRoutePosition(location,points){
 if(!Array.isArray(points)||points.length<2)return{index:0,progress:0,distanceKm:Infinity};
 let best=Infinity,index=0;
 const stride=Math.max(1,Math.floor(points.length/1800));
 for(let i=0;i<points.length;i+=stride){
  const d=distanceKm(location,{lat:points[i][0],lon:points[i][1]});
  if(d<best){best=d;index=i}
 }
 const last=points.length-1;
 for(let i=Math.max(0,index-stride);i<=Math.min(last,index+stride);i++){
  const d=distanceKm(location,{lat:points[i][0],lon:points[i][1]});
  if(d<best){best=d;index=i}
 }
 return{index:index,progress:index/Math.max(1,last),distanceKm:best};
}
function routeDistanceBetweenIndices(points,from,to){
 if(!Array.isArray(points)||points.length<2)return 0;
 let km=0,a=Math.max(0,Math.min(points.length-1,Math.floor(from))),b=Math.max(a,Math.min(points.length-1,Math.floor(to)));
 for(let i=a+1;i<=b;i++)km+=distanceKm({lat:points[i-1][0],lon:points[i-1][1]},{lat:points[i][0],lon:points[i][1]});
 return km;
}

 if(session.lastPosition){
  const elapsed=Math.max(1,now-session.lastPosition.timestamp),delta=distanceKm(session.lastPosition,current);
  if(delta>=.004&&delta<=1.5){
   session.distanceKm+=delta;
   fallbackSpeed=delta*3600000/elapsed;
  }

 }

  if(typeof mapObject.setProgress==='function')mapObject.setProgress(nearest.progress);

function maintenanceStatus(entry){
 const today=new Date();today.setHours(0,0,0,0);const currentKm=Number(state.profile?.bikeOdometer)||0;
 const date=entry.nextDate?new Date(entry.nextDate+'T00:00:00'):null;const km=Number(entry.nextKm)||0;
 if((date&&!Number.isNaN(date.getTime())&&date<today)||(km&&currentKm&&km<=currentKm))return{label:'Scaduto',className:'overdue'};
 if((date&&!Number.isNaN(date.getTime())&&date<=new Date(today.getTime()+30*86400000))||(km&&currentKm&&km-currentKm<=500))return{label:'In scadenza',className:'due'};
 return{label:'Regolare',className:'ok'};
}

function shareCurrentLocation(){

 toast('Richiesta della posizione al browser…');
 navigator.geolocation.getCurrentPosition(async position=>{
  const lat=position.coords.latitude,lon=position.coords.longitude,url='https://www.google.com/maps?q='+lat.toFixed(6)+','+lon.toFixed(6);
  try{if(navigator.share)await navigator.share({title:'La mia posizione',text:'Questa è la mia posizione attuale.',url:url});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);toast('Link della posizione copiato.')}else window.open(url,'_blank','noopener');}
  catch(error){if(error.name!=='AbortError')toast('Non riesco a condividere la posizione.')}
 },()=>toast('Posizione non disponibile: controlla i permessi del browser.'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000});
}

const plannerGeocodeCache=new Map();
let nominatimLastRequestAt=0;
function normalizePlaceName(value){
 return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('it').replace(/[^a-z0-9]+/g,' ').trim();
}
function plannerPlaceDistance(a,b){
 const rad=x=>x*Math.PI/180,R=6371;
 const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);
 const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(h));
}
function knownRidePlace(query){
 const normalized=normalizePlaceName(query),base=normalizePlaceName(String(query).split(',')[0]);
 const known=[];
 (zones||[]).forEach(z=>known.push({name:z.name,lat:Number(z.lat),lon:Number(z.lon)}));
 (routes||[]).forEach(route=>(route.stops||[]).forEach(stop=>known.push({name:stop[0],lat:Number(stop[1]),lon:Number(stop[2])})));
 const found=known.find(p=>normalizePlaceName(p.name)===normalized||normalizePlaceName(p.name)===base);
 return found?{lat:found.lat,lon:found.lon,label:found.name,provider:'catalogo RIDE'}:null;
}
function rankGeocodeResult(item,query,bias){
 const q=normalizePlaceName(String(query).split(',')[0]);
 const name=normalizePlaceName(item.name||'');
 let score=0;
 if(name===q)score+=1000;
 else if(name.startsWith(q)||q.startsWith(name))score+=300;
 if(item.country_code==='it'||item.countryCode==='IT')score+=8;
 if(bias&&Number.isFinite(Number(item.latitude??item.lat))&&Number.isFinite(Number(item.longitude??item.lon))){
  const distance=plannerPlaceDistance(bias,{lat:Number(item.latitude??item.lat),lon:Number(item.longitude??item.lon)});
  score-=Math.min(distance,2000)*0.02;
 }
 return score;
}
function labelOpenMeteoPlace(item){
 return [item.name,item.admin2,item.admin1,item.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ');
}
function labelPhotonPlace(props,query){
 return [props.name,props.street,props.housenumber,props.city||props.town||props.village||props.county,props.state,props.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ')||query;
}
async function plannerFetchJson(url,timeoutMs=10000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const response=await fetch(url,{signal:controller.signal,mode:'cors',cache:'no-store',headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('HTTP '+response.status);
  return await response.json();
 }finally{clearTimeout(timer)}
}
async function waitForNominatimSlot(){
 const delay=Math.max(0,1100-(Date.now()-nominatimLastRequestAt));
 if(delay)await new Promise(resolve=>setTimeout(resolve,delay));
 nominatimLastRequestAt=Date.now();
}
async function geocodeMotorcyclePlace(query,bias){
 const clean=String(query||'').trim();
 if(clean.length<2)throw new Error('Inserisci almeno due caratteri per cercare una località.');
 const cacheKey=normalizePlaceName(clean);
 if(plannerGeocodeCache.has(cacheKey))return plannerGeocodeCache.get(cacheKey);
 const local=knownRidePlace(clean);
 if(local){plannerGeocodeCache.set(cacheKey,local);return local;}
 const failures=[];
 const biasPoint=bias&&Number.isFinite(Number(bias.lat))&&Number.isFinite(Number(bias.lon))?{lat:Number(bias.lat),lon:Number(bias.lon)}:null;

 // Provider 1: Open-Meteo / GeoNames. Reliable for towns, cities and named settlements.
 try{
  const params=new URLSearchParams({name:clean,count:'10',language:'it',format:'json'});
  let data=await plannerFetchJson('https://geocoding-api.open-meteo.com/v1/search?'+params.toString());
  let results=Array.isArray(data.results)?data.results:[];
  if(!results.length&&clean.includes(',')){
   const shortName=clean.split(',')[0].trim();
   if(shortName.length>=2){
    const retry=new URLSearchParams({name:shortName,count:'10',language:'it',format:'json'});
    data=await plannerFetchJson('https://geocoding-api.open-meteo.com/v1/search?'+retry.toString());
    results=Array.isArray(data.results)?data.results:[];
   }
  }
  if(results.length){
   results.sort((a,b)=>rankGeocodeResult(b,clean,biasPoint)-rankGeocodeResult(a,clean,biasPoint));
   const item=results[0],point={lat:Number(item.latitude),lon:Number(item.longitude),label:labelOpenMeteoPlace(item)||clean,provider:'Open-Meteo / GeoNames'};
   if(Number.isFinite(point.lat)&&Number.isFinite(point.lon)){plannerGeocodeCache.set(cacheKey,point);return point;}
  }
  failures.push('località non trovata nel catalogo geografico');
 }catch(error){failures.push('Open-Meteo non raggiungibile');}

 // Provider 2: Photon / OpenStreetMap. Useful for named places, passes and addresses.
 try{
  const params=new URLSearchParams({q:clean,limit:'5',lang:'it'});
  if(biasPoint){params.set('lat',String(biasPoint.lat));params.set('lon',String(biasPoint.lon));params.set('zoom','8');}
  const data=await plannerFetchJson('https://photon.komoot.io/api/?'+params.toString());
  const features=Array.isArray(data.features)?data.features:[];
  if(features.length){
   const ranked=features.map(feature=>{
    const coords=feature.geometry?.coordinates||[];
    const props=feature.properties||{};
    const item={name:props.name||props.city||props.county,latitude:Number(coords[1]),longitude:Number(coords[0]),country_code:String(props.countrycode||'').toLowerCase()};
    return {feature:feature,item:item};
   }).filter(x=>Number.isFinite(x.item.latitude)&&Number.isFinite(x.item.longitude));
   ranked.sort((a,b)=>rankGeocodeResult(b.item,clean,biasPoint)-rankGeocodeResult(a.item,clean,biasPoint));
   if(ranked.length){
    const chosen=ranked[0],point={lat:chosen.item.latitude,lon:chosen.item.longitude,label:labelPhotonPlace(chosen.feature.properties||{},clean),provider:'Photon / OpenStreetMap'};
    plannerGeocodeCache.set(cacheKey,point);return point;
   }
  }
  failures.push('nessun risultato Photon');
 }catch(error){failures.push('Photon non raggiungibile');}

 // Provider 3: Nominatim / OpenStreetMap. Used only on explicit form submission, not autocomplete.
 try{
  await waitForNominatimSlot();
  const params=new URLSearchParams({q:clean,format:'jsonv2',limit:'5','accept-language':'it',addressdetails:'1'});
  const data=await plannerFetchJson('https://nominatim.openstreetmap.org/search?'+params.toString(),12000);
  if(Array.isArray(data)&&data.length){
   const ranked=data.map(item=>({item:item,score:rankGeocodeResult({name:item.name||item.display_name,lat:Number(item.lat),lon:Number(item.lon),country_code:item.address?.country_code},clean,biasPoint)}));
   ranked.sort((a,b)=>b.score-a.score);
   const item=ranked[0].item,address=item.address||{};
   const label=[item.name||address.road||clean,address.city||address.town||address.village||address.municipality||address.county,address.state,address.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ')||item.display_name||clean;
   const point={lat:Number(item.lat),lon:Number(item.lon),label:label,provider:'Nominatim / OpenStreetMap'};
   if(Number.isFinite(point.lat)&&Number.isFinite(point.lon)){plannerGeocodeCache.set(cacheKey,point);return point;}
  }
  failures.push('nessun risultato OpenStreetMap');
 }catch(error){failures.push('OpenStreetMap non raggiungibile');}

 if(failures.every(x=>x.includes('non raggiungibile'))){
  throw new Error('I servizi di ricerca località non rispondono in questo momento. Riprova tra poco oppure controlla la connessione.');
 }
 throw new Error('Non trovo “'+clean+'”. Prova ad aggiungere provincia e Paese, ad esempio “Riva del Garda, Trento, Italia”.');
}

function decodePolyline6(encoded){
 let index=0,lat=0,lon=0,points=[];
 while(index<encoded.length){
  let result=0,shift=0,b;
  do{b=encoded.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32&&index<encoded.length);
  lat+=result&1?~(result>>1):(result>>1);
  result=0;shift=0;
  do{b=encoded.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32&&index<encoded.length);
  lon+=result&1?~(result>>1):(result>>1);
  points.push([lat/1e6,lon/1e6]);
 }
 return points;
}

 }).join('');

async function calculateMotorcycleRoute(form){
 const button=form.querySelector('[type=submit]'),data=new FormData(form);
 const originText=String(data.get('origin')||'').trim(),viaText=String(data.get('via')||'').trim(),destinationText=String(data.get('destination')||'').trim();
 const profileId=String(data.get('profile')||'curvy'),profile=MOTORCYCLE_ROUTE_PROFILES[profileId]||MOTORCYCLE_ROUTE_PROFILES.curvy;
 const avoidHighways=data.get('avoidHighways')==='on',avoidTolls=data.get('avoidTolls')==='on';
 if(!originText||!destinationText){setMotorcyclePlannerStatus('Inserisci una partenza e una destinazione.',true);return}
 if((state.customRoutes||[]).length>=MAX_PERSONAL_GPX_ROUTES){setMotorcyclePlannerStatus('La libreria personale è piena. Elimina prima un percorso GPX o personale.',true);return}
 const previous=state.routePlanner||defaults.routePlanner;
 const resolve=async(text,point,label)=>{
  if(point&&label===text&&Number.isFinite(point.lat)&&Number.isFinite(point.lon))return point;
  return geocodeMotorcyclePlace(text,state.center);
 };
 button.disabled=true;button.classList.add('loading');
 setMotorcyclePlannerStatus('Ricerca della partenza: '+originText+'…');
 try{
  const origin=await resolve(originText,previous.originPoint,previous.originLabel);
  setMotorcyclePlannerStatus('Partenza trovata. '+(viaText?'Ricerca della tappa intermedia: '+viaText+'…':'Ricerca della destinazione: '+destinationText+'…'));
  const via=viaText?await resolve(viaText,previous.viaPoint,previous.viaLabel):null;
  if(viaText)setMotorcyclePlannerStatus('Tappa intermedia trovata. Ricerca della destinazione: '+destinationText+'…');
  const destination=await resolve(destinationText,previous.destinationPoint,previous.destinationLabel);
  setMotorcyclePlannerStatus('Località individuate. Calcolo del percorso motociclistico…');
  const locations=[origin,via,destination].filter(Boolean).map(p=>({lat:p.lat,lon:p.lon,type:'break',name:p.label}));
  const motorcycleOptions={
   use_highways:avoidHighways?0:profile.use_highways,
   use_trails:profile.use_trails,
   use_curvature:profile.use_curvature,
   use_ferry:profile.use_ferry,
   use_tolls:avoidTolls?0:profile.use_tolls
  };
  const payload={locations:locations,costing:'motorcycle',costing_options:{motorcycle:motorcycleOptions},units:'kilometers',language:'it-IT',directions_type:'instructions',format:'json',elevation_interval:30,roundabout_exits:true,id:'ride-'+Date.now()};
  setMotorcyclePlannerStatus('Calcolo del percorso sulle strade con il profilo '+profile.label+'…');
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
  let response,data;
  try{
   response=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',mode:'cors',signal:controller.signal,headers:{'Content-Type':'application/json','Accept':'application/json','X-Client-Id':'ride-community.github.io'},body:JSON.stringify(payload)});
   if(!response.ok)throw new Error(response.status===429?'Il servizio di routing è momentaneamente occupato. Riprova tra poco.':'Il motore di routing non ha accettato la richiesta ('+response.status+').');
   data=await response.json();
  }finally{clearTimeout(timer)}
  const trip=data.trip;if(!trip?.legs?.length)throw new Error(trip?.status_message||'Non è stato possibile calcolare questo itinerario.');
  const latlngs=[];
  (trip.legs||[]).forEach(leg=>{
   const shape=typeof leg.shape==='string'?decodePolyline6(leg.shape):[];
   shape.forEach(point=>{const last=latlngs[latlngs.length-1];if(!last||Math.abs(last[0]-point[0])>1e-7||Math.abs(last[1]-point[1])>1e-7)latlngs.push(point)});
  });
  if(latlngs.length<2)throw new Error('Il servizio ha restituito un percorso senza geometria valida.');
  const summary=trip.summary||{},distance=Number(summary.length)||0,durationMinutes=Math.max(1,Math.round((Number(summary.time)||0)/60));
  let shapeOffset=0;
  const instructions=(trip.legs||[]).flatMap(leg=>{
   const legPoints=typeof leg.shape==='string'?decodePolyline6(leg.shape):[];
   const items=(leg.maneuvers||[]).map(m=>({
    instruction:m.instruction||m.verbal_transition_alert_instruction||'Prosegui',
    length:Number(m.length)||0,time:Number(m.time)||0,
    streetNames:Array.isArray(m.street_names)?m.street_names:[],
    rough:!!m.rough,toll:!!m.toll,highway:!!m.highway,ferry:!!m.ferry,
    type:m.type,beginShapeIndex:shapeOffset+Number(m.begin_shape_index||0),endShapeIndex:shapeOffset+Number(m.end_shape_index||0)
   }));
   shapeOffset+=Math.max(0,legPoints.length-1);
   return items;
  });
  const stops=locations.map((p,i)=>[i===0?'Partenza':i===locations.length-1?'Arrivo':'Tappa intermedia',p.lat,p.lon,0]);
  const id='moto-'+Date.now().toString(36);
  const gpx={id:id,sourceType:'motorcycle',name:origin.label+' → '+destination.label,origin:origin,destination:destination,latlngs:latlngs,elevations:[],distance:distance,durationMinutes:durationMinutes,profile:profile.label,profileId:profileId,instructions:instructions,stops:stops,importedAt:new Date().toISOString(),notes:'Percorso calcolato da Valhalla con il profilo motociclistico '+profile.label+'. Controlla sempre segnaletica, accessi, divieti e condizioni effettive della strada.'};
  state.customRoutes=[gpx,...(state.customRoutes||[])];
  state.importedGpx=gpx;
  state.routePlanner={...previous,originText:origin.label,originPoint:{lat:origin.lat,lon:origin.lon},originLabel:origin.label,viaText:via?.label||'',viaPoint:via?{lat:via.lat,lon:via.lon}:null,viaLabel:via?.label||'',destinationText:destination.label,destinationPoint:{lat:destination.lat,lon:destination.lon},destinationLabel:destination.label,profile:profileId,avoidHighways:avoidHighways,avoidTolls:avoidTolls,lastRouteId:id};
  registerImportedGpxRoute();
  state.selectedRoute=id;state.view='routes';state.routeCountryFilter='';state.routeRegionFilter='';state.routeProvinceFilter='';state.routeSearch='';
  if(!save())throw new Error('Il browser non ha spazio sufficiente per salvare il nuovo itinerario.');
  render();
  toast('Percorso moto calcolato · '+Math.round(distance)+' km · '+profile.label+'.');
 }catch(error){
  setMotorcyclePlannerStatus(error.name==='AbortError'?'Il calcolo ha superato il tempo massimo. Riprova.':(error.message||'Non riesco a calcolare il percorso. Verifica la connessione.'),true);
 }finally{
  if(button.isConnected){button.disabled=false;button.classList.remove('loading')}
 }
}
function useCurrentLocationForPlanner(button){
 if(!navigator.geolocation){setMotorcyclePlannerStatus('La geolocalizzazione non è disponibile su questo dispositivo.',true);return}
 button.disabled=true;setMotorcyclePlannerStatus('Richiesta della posizione al browser…');
 navigator.geolocation.getCurrentPosition(position=>{
  const point={lat:position.coords.latitude,lon:position.coords.longitude},label='La mia posizione';
  const p=state.routePlanner||defaults.routePlanner;
  state.routePlanner={...p,originText:label,originLabel:label,originPoint:point};
  const input=$('#planner-origin');if(input)input.value=label;
  save();setMotorcyclePlannerStatus('Partenza impostata sulla tua posizione attuale. Premi “Calcola percorso moto” per continuare.');
  button.disabled=false;
 },()=>{
  setMotorcyclePlannerStatus('Posizione non disponibile. Controlla i permessi del browser oppure inserisci una località.',true);
  button.disabled=false;
 },{enableHighAccuracy:false,timeout:12000,maximumAge:60000});
}

function compressImageFile(file,maxSide=1000,quality=.72){
 return new Promise((resolve,reject)=>{
  if(!file||!file.type||!file.type.startsWith('image/')){reject(new Error('File immagine non valido'));return}
  const reader=new FileReader();reader.onerror=()=>reject(new Error('Lettura immagine non riuscita'));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Immagine non leggibile'));
   img.onload=()=>{const scale=Math.min(1,maxSide/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality));
   };img.src=String(reader.result)
  };reader.readAsDataURL(file)
 })
}

function localNotifications(){
 const items=[],now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 (state.maintenanceEntries||[]).forEach(entry=>{
  const status=maintenanceStatus(entry);
  if(status.className==='ok')return;
  items.push({kind:'maintenance',priority:status.className==='overdue'?0:1,title:entry.type+' · '+status.label,body:entry.nextDate?'Scadenza '+formatDiaryDate(entry.nextDate):entry.nextKm?'Prossimo controllo a '+Number(entry.nextKm).toLocaleString('it-IT')+' km':'Controlla il registro manutenzione.',action:'profile',label:'Apri garage'});
 });
 (state.tripPlans||[]).forEach(trip=>(trip.days||[]).forEach(day=>{const date=day.date;if(!date||date<localDateString()||date>datePlusDays(14))return;const route=routes.find(r=>r.id===day.routeId);items.push({kind:'trip',priority:2,date:new Date(date+'T'+(day.time||'09:00')+':00'),title:'Viaggio: '+trip.title,body:formatDiaryDate(date)+' · '+(route?.name||'Itinerario da definire'),action:'trips',label:'Apri viaggio'})}));
 (state.myRides||[]).forEach(ride=>{
  if(!ride.date)return;
  const date=new Date(String(ride.date).slice(0,10)+'T'+(ride.time||'09:00')+':00');
  if(Number.isNaN(date.getTime())||date<today||date>new Date(today.getTime()+60*86400000))return;
  items.push({kind:'ride',priority:2,date:date,title:'Prossima uscita: '+(ride.title||'Uscita in moto'),body:formatDiaryDate(ride.date)+' · '+(ride.time||'Orario da definire')+' · '+(ride.route||'Itinerario da definire'),action:'events',label:'Apri uscite'});
 });
 return items.sort((a,b)=>a.priority-b.priority||(a.date||0)-(b.date||0));
}

  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(window.__rideSwControllerReloaded)return;
    window.__rideSwControllerReloaded=true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const registration=await navigator.serviceWorker.register('./sw.js?release=v19',{updateViaCache:'none'});
      await registration.update();
      if(registration.waiting)registration.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(error){
      console.warn('RIDE: aggiornamento PWA non riuscito.',error);
    }
  });
